---
layout: default
---
<article class="wrap prose post">
  <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }} · Brooke AI blog</p>
  <h1>{{ page.title }}</h1>
  {{ content }}
  <div class="post-cta card">
    <p><strong>Hear Brooke for yourself.</strong> Call our live demo line at <a href="tel:{{ site.company.demo_number | remove: '(' | remove: ')' | remove: ' ' | remove: '-' | prepend: '+1' }}">{{ site.company.demo_number }}</a> and book a pretend appointment — she won't mind.</p>
    <a class="btn btn-primary" href="{{ '/contact/' | relative_url }}">Talk to us</a>
  </div>
</article>
